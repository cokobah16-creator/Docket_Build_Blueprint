<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Docket</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #F7F5F0; color: #111; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 24px; }
  main { max-width: 420px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; color: #0F2A44; }
  p { color: #444; line-height: 1.5; }
  button { margin-top: 16px; padding: 12px 20px; border: 0; border-radius: 10px; background: #0F2A44; color: #fff; font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>Your matters, documents and messages need a connection. If you were sending something when it dropped, it did not go through — when you are back online, check for it and send it again if it is not there.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>

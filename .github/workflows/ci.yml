# Docket — continuous integration.
#
# Six things can be checked without a Supabase project, a Paystack account or a domain, and
# all six are checked on every push:
#
#   sql        the migrations apply in order against an empty Postgres 16, the seed loads, and
#              every suite in supabase/tests passes — AND still makes the number of assertions it
#              is meant to (supabase/tests/expected-checks.tsv). This is the one that matters: the
#              database IS the authorization layer, so a broken policy is a broken product, and the
#              suite exercises each read and write from both sides of every wall. Counting suites
#              alone let a gutted one stay green; it counts checks now.
#   typecheck  TypeScript, strict, over app/, src/, middleware.ts and the tests.
#   deno       the Edge Functions type-check, the partner API's OpenAPI document is held to the
#              routes that function actually serves, and the PDF, calendar and text-extraction
#              writers are RUN — against what a Nigerian invoice, a court diary and an uploaded agreement
#              actually carry. They are Deno, not Node: tsconfig.json
#              excludes supabase/functions and the typecheck job never looks at them.
#   routes     a real `next build`, checked against the content security policy: every route
#              Next.js prerenders must be one the nonce policy accounts for, or the page ships
#              as dead HTML. See scripts/check-prerendered-routes.mjs.
#   compat     this branch's migrations, then main's own seed and RLS suite run against them, and
#              every relation and function main's code names checked for existence — the deployed
#              front end's expectations of the database, from main's side.
#   lockfile   installs are reproducible: npm ci from the committed lockfile. Should it ever go
#              missing the job regenerates it and hands it back to be committed — and then FAILS,
#              because a missing lockfile is now a regression rather than a state to warn about.
#
# A seventh, e2e, needs a configured Supabase project and is therefore GATED — see the bottom of
# this file for exactly what it needs and why it is skipped without it.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- the database
  sql:
    name: Migrations, seed and the RLS suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Steps start the moment the container is up; without this the first psql races it.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # The runner image already carries a psql, but not necessarily a 16 one, and a client
      # older than the server garbles \copy and the newer error formats. Pin it from PGDG.
      - name: Install the PostgreSQL 16 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          psql --version

      - name: Run the suite
        # A BARE url on purpose. scripts/db-test-local.sh builds the test database's connection
        # string as "${DATABASE_URL%/*}/docket_test" — it keeps everything before the final
        # slash — so a "?sslmode=..." or any other query string would be silently swallowed and
        # the script would connect to a database nobody asked for.
        #
        # The suite needs a SUPERUSER: tests/00_local_auth_stub.sql creates the anon,
        # authenticated and service_role roles and an auth schema, sets default privileges, and
        # the tests SET ROLE between them. The postgres user of the service container is one.
        # It also drops and recreates a database called docket_test, which is why this is only
        # ever pointed at a throwaway Postgres and never at a Supabase project.
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          bash scripts/db-test-local.sh 2>&1 | tee db-test.log

      - name: Every suite must have finished, and finished passing
        # The script already fails the job on the first FAIL: t_check() raises, psql runs with
        # ON_ERROR_STOP=1, and the loop tests PIPESTATUS. This step is the second lock. It
        # catches the case that failure mode cannot: a suite that never ran at all — a file
        # added to supabase/tests and skipped, or output that stopped part way — which would
        # otherwise leave the job green with checks that were never made.
        run: |
          set -euo pipefail
          suites=$(ls supabase/tests/[1-9]*.sql | wc -l | tr -d '[:space:]')
          passed=$(grep -c 'ALL CHECKS PASSED' db-test.log || true)
          passed=$(printf '%s' "$passed" | tr -d '[:space:]')
          echo "suites in supabase/tests: $suites — suites that reported passing: $passed"
          if grep -q '^ERROR\|FAIL  ' db-test.log; then
            echo "::error::a check failed or a statement errored — see the log above"
            exit 1
          fi
          if [ "$passed" -ne "$suites" ]; then
            echo "::error::$suites suites exist but only $passed reported ALL CHECKS PASSED"
            exit 1
          fi

      - name: And every suite must still make the checks it is meant to
        # The step above counts SUITES. A suite cut down to a single assertion still prints
        # "ALL CHECKS PASSED" and still counts, so the matter walls or the registry boundary could
        # lose their coverage entirely without a job going red — a check that cannot fail, at the
        # centre of the gate that is supposed to make the rest trustworthy.
        #
        # supabase/tests/expected-checks.tsv is a per-suite FLOOR: adding assertions never breaks
        # the build, removing them always does, and lowering a floor is a visible one-line diff.
        # This step also holds README.md's stated counts to what actually ran.
        run: bash scripts/check-suite-counts.sh db-test.log

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-test-log
          path: db-test.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------- the schema vs the deployed code
  #
  # Migrations reach the live project from a branch; the front end that is actually serving comes
  # from main. In between, the live schema is AHEAD of the code reading it — which is only safe if
  # every read that code makes still works. supabase/tests/70_deployed_frontend_compat.sql pins
  # that contract from this branch's side. This job checks it from main's side: it builds the
  # database from THIS branch's migrations and then runs the explicit deployed-frontend contract
  # against it. We do not run main's entire historical RLS suite as a proxy: that suite also pins
  # security behaviours the frontend never relies on (for example pre-MFA table visibility), so a
  # deliberate hardening change can make it stale without breaking deployed code.
  #
  # main's files are materialised under $RUNNER_TEMP, never under supabase/tests/: the sql job
  # counts suites by listing that directory, and a file dropped there would inflate the count.
  # main's seed is used, not this branch's — a seed difference must not read as a compat failure.
  compat:
    name: deployed frontend contract against this schema
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Fetch main
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - name: Install the PostgreSQL 16 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16

      - name: Build this branch's schema, then run the deployed-frontend contract
        env:
          PGPASSWORD: postgres
          URL: postgres://postgres:postgres@localhost:5432
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/compat"; mkdir -p "$T"
          git show origin/main:supabase/seed.sql > "$T/main_seed.sql"
          echo "main is $(git rev-parse --short origin/main); this branch has $(ls supabase/migrations/*.sql | wc -l) migrations"
          psql "$URL/postgres" -v ON_ERROR_STOP=1 -q -c "drop database if exists docket_compat" -c "create database docket_compat"
          psql "$URL/docket_compat" -v ON_ERROR_STOP=1 -q -f supabase/tests/00_local_auth_stub.sql
          for f in supabase/migrations/*.sql; do psql "$URL/docket_compat" -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql "$URL/docket_compat" -v ON_ERROR_STOP=1 -q -f "$T/main_seed.sql"
          psql "$URL/docket_compat" -v ON_ERROR_STOP=1 -q -f supabase/tests/70_deployed_frontend_compat.sql 2>&1 \
            | sed -E 's/^psql:[^:]+:[0-9]+: //' | grep -E 'PASS|FAIL|ERROR|ALL CHECKS' | tee compat.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -q 'ALL CHECKS PASSED' compat.log || { echo "::error::deployed frontend contract did not report ALL CHECKS PASSED against this schema"; exit 1; }
          echo "deployed frontend contract: $(grep -c 'PASS  ' compat.log) checks pass against this branch's schema"

      # main's suite exercises what main's tests cover, which is not every screen — the admin
      # surfaces in particular. This reads every relation and function name straight out of main's
      # code and asks the schema for each one, so a rename that no test touches still fails here.
      - name: Every relation and function main's code names exists in this schema
        env:
          PGPASSWORD: postgres
        run: bash scripts/check-deployed-reads.sh origin/main postgres://postgres:postgres@localhost:5432/docket_compat

  # ---------------------------------------------------------------- reproducible installs
  #
  # package-lock.json is committed (generated by this very job on its first run and pulled from
  # its log, since the registry is unreachable where the code is written), so every job installs
  # with `npm ci` from it: the same tree on every run, and a pinned surface for npm audit and
  # Dependabot. This job proves the lockfile still installs. Should it ever be deleted, the job
  # regenerates it and hands it back — as an artifact and as base64 in the log — to be committed.
  lockfile:
    name: Reproducible installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: A lockfile, or the makings of one
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
            echo "package-lock.json is present and npm ci installs from it"
            exit 0
          fi
          # The lockfile is committed (runbook 0a, 11 Sep). A missing one is now a REGRESSION, not
          # a project that has not got one yet, so this fails. The regenerate-and-hand-back below
          # is kept because it is the cheapest recovery — but it runs on the way to red, not
          # instead of it. Warning-and-exit-0 is how a job stops being a check.
          echo "::error::no package-lock.json — installs are not reproducible. One is generated below; commit it."
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo "----- package-lock.json base64 begin -----"
          base64 -w0 package-lock.json | fold -w 200
          echo
          echo "----- package-lock.json base64 end -----"
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------- the app
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Keyed on package-lock.json, which exists now: see the lockfile job above.
          cache: npm

      # npm ci, from the committed lockfile: the same tree on every run, so this job goes red
      # for this repository's change and never for somebody else's release.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

  # ---------------------------------------------------------------- the Edge Functions
  deno:
    name: Edge Functions typecheck, and the PDF, calendar and extraction checks run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deno ships as a single binary from its GitHub releases, so this step needs nothing from
      # the npm registry to install — which is why the Edge Functions can be checked in CI even
      # though they import npm: specifiers.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check every function
        # supabase/functions/*/index.ts is the whole surface: one entry point per function, each
        # deployed on its own. `deno check` resolves the npm: imports and their types the same
        # way the Supabase runtime does.
        #
        # --node-modules-dir=none is required and is not a detail. Without it deno looks for a
        # node_modules directory, does not find one, and refuses before it checks anything. With
        # `auto` it would instead walk up to the repository's own package.json and install the
        # whole Next.js tree — react, playwright, tailwind — to check three Deno files that
        # import none of it. `none` resolves npm: specifiers from deno's own cache, which fetches
        # exactly what the functions import: @supabase/supabase-js and web-push. That is also
        # how the Supabase Edge runtime resolves them, so it is the honest check as well as the
        # cheap one.
        run: deno check --node-modules-dir=none supabase/functions/*/index.ts

      - name: The partner API's OpenAPI document describes the routes it serves
        # supabase/functions/partner-api/index.ts told partners its contract was "said in the
        # OpenAPI document" while no such document existed. docs/partner-api.v1.yaml is that
        # document; this is what stops the sentence going false again. It checks BOTH directions:
        # a route in the code and not the spec is an undocumented surface, and a route in the spec
        # and not the code is a promise nobody keeps — the worse of the two, because a partner
        # writes code against it, ships, and gets a 404 from production.
        run: bash scripts/check-openapi-routes.sh

      - name: The PDF writer holds
        # src/lib/pdf.ts is dependency-free TypeScript and is the only thing between a client and
        # their invoice, so it is run, not merely compiled: runs of spaces are the invoice's only
        # column and must survive wrapping, and text the standard fonts cannot draw must be
        # refused by name rather than printed as "?". No npm specifiers, hence --node-modules-dir=none.
        #
        # The script lives under scripts/, which tsconfig.json excludes alongside supabase/functions:
        # it imports with a .ts extension and calls Deno.exit, neither of which the Next compiler
        # accepts. A new .ts file anywhere else in the tree lands in that compiler's include by
        # default — check before adding one.
        run: deno run --node-modules-dir=none scripts/check-pdf.ts

      - name: The calendar writer holds
        # calendar-feed/ics.ts is the other dependency-free writer between Docket and somebody's day,
        # and
        # every way it fails is silent: a calendar app meeting a bad line shows the wrong thing or
        # nothing, and the thing not shown is a court date. Run, not merely compiled.
        run: deno run --node-modules-dir=none scripts/check-ics.ts

      - name: The extractor holds
        # extract-text/extract.ts decides what a firm can find inside its own files, and it fails
        # quietly in both directions: mojibake indexed as text, or a readable document recorded as
        # unreadable. The sharpest assertion in it is a ROUND TRIP — pdf.ts writes a PDF and
        # extract.ts reads the words back out — so the two modules check each other against a real
        # file rather than a fixture written to pass.
        run: deno run --node-modules-dir=none scripts/check-extract.ts

  # ---------------------------------------------------------------- the policy vs the build
  #
  # src/lib/csp.ts hands every route a nonce-based script-src except a hand-written set of
  # prerendered shells. A page rendered at BUILD time has no request, so its inline bootstrap
  # scripts carry no nonce and the strict policy blocks them: the HTML arrives, React never
  # hydrates, and every control on the page is dead. Which routes those are cannot be read off
  # the source — only off the route table of a real build — and the set was once wrong by four
  # routes, among them firm registration, TOTP enrolment and the platform console.
  routes:
    name: Prerendered routes match the policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        # PLACEHOLDER SUPABASE VALUES, ON PURPOSE, and they are never contacted. src/lib/env.ts
        # returns null when these are unset and src/lib/supabase/server.ts then returns early
        # WITHOUT calling cookies() — so on an unconfigured build a page that reads the session
        # touches no dynamic API and Next prerenders it. That would make this job's route table
        # a different shape from a real deployment's and the check meaningless. With the pair
        # set, every such page reaches cookies() and is dynamic, exactly as in production.
        # Nothing is fetched from them: the pages that hold them are dynamic by then, so they
        # do not render during the build.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder_not_a_real_key
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee build.log

      - name: Every prerendered route must be one the policy knows about
        run: node scripts/check-prerendered-routes.mjs build.log

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------- browser smoke tests
  #
  # tests/e2e/smoke.spec.ts has four tests: the platform landing, a tenant's public home,
  # /firm/start and /app/login. Without a configured Supabase the tenant test SKIPS itself
  # outright, and two of the others drop their real assertions — the sign-in forms render a
  # "not configured" notice instead of the Phone and Email tabs, because a tenant is resolved
  # from firm_public and there is nothing to resolve against. What is left is one page load.
  # That is a green tick that proves nothing, so this job is gated instead of run empty.
  #
  # TO TURN IT ON, set three repository secrets:
  #   NEXT_PUBLIC_SUPABASE_URL       the project URL
  #   NEXT_PUBLIC_SUPABASE_ANON_KEY  its anon / publishable key
  #   E2E_FIRM_SLUG                  the slug of a firm that is ACTIVE in that project — the
  #                                  fallback in the spec file names one particular firm, which
  #                                  will not exist in your project
  #
  # These tests only read public pages. They sign nobody in and write nothing. Even so, point
  # them at a staging project rather than the one your firms are using.
  #
  # The `secrets` context cannot be read in a job-level `if:`, so the presence check is its own
  # job and the answer travels as an output.
  e2e-preflight:
    name: Are the e2e secrets set?
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          FIRM_SLUG: ${{ secrets.E2E_FIRM_SLUG }}
        run: |
          set -euo pipefail
          # All three, because the e2e job passes all three. Checking two of them would let the
          # job start with no anon key and fail as though the app were broken.
          if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_ANON_KEY:-}" ] && [ -n "${FIRM_SLUG:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "e2e skipped: set NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY and E2E_FIRM_SLUG as repository secrets to run it."
          fi

  e2e:
    name: Playwright smoke (mobile)
    runs-on: ubuntu-latest
    needs: [e2e-preflight, typecheck]
    if: needs.e2e-preflight.outputs.configured == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # playwright.config.ts runs one project, "mobile-chrome" on a Pixel 7, so only Chromium
      # is needed. Mobile first: 390px is the width Docket is designed at.
      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # With no PLAYWRIGHT_BASE_URL the config starts `npm run dev` itself and waits for it.
      - name: Run the smoke tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_FIRM_SLUG: ${{ secrets.E2E_FIRM_SLUG }}
        run: npm run test:e2e

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
